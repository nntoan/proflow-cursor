name: release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write # OIDC trusted publisher
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w tweakcursor
      - run: npm test -w tweakcursor
      - run: npm run build -w tweakcursor
      - run: npm publish -w tweakcursor --provenance --access public
